# Continuous integration: runs on every push to main and every pull request.
# Two independent jobs run in parallel: one for the Go API, one for Python ingestion.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# If you push again while CI is still running on the same branch, cancel the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  go:
    name: Go (api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go (version taken from api/go.mod)
        uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          working-directory: api

      - name: go test (with race detector)
        run: go test -race ./...

  python:
    name: Python (ingest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install tools
        run: python -m pip install ruff pytest

      - name: ruff (lint)
        run: ruff check .

      - name: ruff (format check)
        run: ruff format --check .

      - name: pytest
        run: pytest